services:
  web:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    restart: unless-stopped
    volumes:
      # By default, the data is stored in a docker volume called "data".
      # If you want to mount a custom directory, change the volume mapping to:
      # - /path/to/your/directory:/data
      - ~/karakeep/data:/data
    ports:
      - 3000:3000
    env_file:
      - /home/andrew/nixos-config/internalServer/.env
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      # OPENAI_API_KEY: ...

      # You almost never want to change the value of the DATA_DIR variable.
      # If you want to mount a custom directory, change the volume mapping above instead.
      DATA_DIR: /data # DON'T CHANGE THIS
      ######
      # moved from .env file
      KARAKEEP_VERSION: 0.24.1
      NEXTAUTH_SECRET: qbd7vJGcsp8q9f/wzIeRwiI6S/tq37icLd/Macl6erGLhpRR
      MEILI_MASTER_KEY: S/tSFa2DkZThfWG8na+WPNzjRGX9h15GHKA1tGSMCeU4mbnH
      NEXTAUTH_URL: http://localhost:3000
      OLLAMA_BASE_URL: http://localhost:11434
      INFERENCE_TEXT_MODEL: llama3.1:8b
      INFERENCE_IMAGE_MODEL: llava:7b
      INFERENCE_JOB_TIMEOUT_SEC: 60
  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:123
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    restart: unless-stopped
    env_file:
      - /home/andrew/nixos-config/internalServer/.env
    environment:
      MEILI_NO_ANALYTICS: "true"
      ######
      # moved from .env file
      KARAKEEP_VERSION: 0.24.1
      NEXTAUTH_SECRET: qbd7vJGcsp8q9f/wzIeRwiI6S/tq37icLd/Macl6erGLhpRR
      MEILI_MASTER_KEY: S/tSFa2DkZThfWG8na+WPNzjRGX9h15GHKA1tGSMCeU4mbnH
      NEXTAUTH_URL: http://localhost:3000
    volumes:
      - ~/karakeep/meilisearch:/meili_data

volumes:
  meilisearch:
  data:
