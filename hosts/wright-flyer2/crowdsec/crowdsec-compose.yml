crowdsec:
  image: crowdsecurity/crowdsec
  restart: always
  ports:
    - 127.0.0.1:8080:8080
  environment:
    COLLECTIONS: "crowdsecurity/linux"
    GID: "${GID-1000}"
  volumes:
    - ./config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
    - /var/log/caddy:/var/log/caddy:ro
    - crowdsec-db:/var/lib/crowdsec/data/
    - crowdsec-config:/etc/crowdsec/
    