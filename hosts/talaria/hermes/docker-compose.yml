services:
  hermes:
    # Update explicitly; avoid following the moving latest tag.
    image: nousresearch/hermes-agent:v2026.9.24
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
    env_file:
      - /run/agenix/hermes-dashboard-env
      - /run/agenix/hermes-homeassistant-env
      # Mealie can be configured after the gateway is deployed.
      - path: /run/agenix/hermes-mealie-env
        required: false
    ports:
      - "100.115.7.109:9119:9119"
    volumes:
      # Weekly consistent snapshots are managed by backup.nix.
      - /var/lib/hermes/data:/opt/data
      # Pin the MCP connection through Hermes's managed configuration layer.
      - type: bind
        source: /etc/hermes/mcp-config.yaml
        target: /etc/hermes/config.yaml
        read_only: true
        bind:
          create_host_path: false
    # Hermes loads API keys and platform settings from /opt/data/.env,
    # written by the setup wizard. Do not put credentials in this file.
    # Dashboard, Home Assistant, and Mealie credentials come from agenix.
    # Publish the Desktop backend only on talaria's Tailscale address.
    # Keep the image's default entrypoint: it initializes data permissions,
    # drops to the hermes user, and supervises the gateway.
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 512
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
