services:
  hermes:
    # Update explicitly; avoid following the moving latest tag.
    image: nousresearch/hermes-agent:v2026.9.24
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - /var/lib/hermes/data:/opt/data
    # Hermes loads API keys and platform settings from /opt/data/.env,
    # written by the setup wizard. Do not put credentials in this file.
    # No published ports are needed for CLI use or outbound chat integrations.
    # Keep the image's default entrypoint: it initializes data permissions,
    # drops to the hermes user, and supervises the gateway.
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 512
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
